services:
  temp-monitor:
    image: temp-monitor:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount the sensor data directory from the Pi to the container
      - /sys/bus/w1/devices:/sys/bus/w1/devices:ro
      # Persist the database file locally
      - ./db:/app/db
      # Persist node_modules to avoid recompiling sqlite3 on every deploy
      - node_modules_data:/app/node_modules
      # Mount source code for "Quick Deploy" / Development
      # This allows ./deploy.sh --quick to work by updating files on host
      - ./:/app
    environment:
      - W1_BASE_PATH=/sys/bus/w1/devices
    privileged: true # Required for hardware access

volumes:
  node_modules_data:
