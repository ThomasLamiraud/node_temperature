services:
  temp-monitor:
    image: temp-monitor:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist the database file locally
      - ./db:/app/db
    environment:
      - DHT_SENSOR_TYPE=22
      # BCM GPIO number where the DHT22 data pin is connected
      - DHT_GPIO_PIN=4
    privileged: true # Required for hardware access
